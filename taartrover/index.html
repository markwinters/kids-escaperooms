<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De Taartrover · Feestmissie</title>
<meta name="description" content="Speel De Taartrover: een escaperoom voor een kinderfeestje thuis, met timer, hints en codeslot op de telefoon.">
<meta name="theme-color" content="#17153a">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;700;800;900&family=Special+Elite&display=swap">
<style>
/* Layout: one phone-sized game column on a blueberry night; the parent guide widens to show the four A4 puzzle sheets */
:root {
  --night: #17153a;      /* bosbes: page ground */
  --card: #221f52;       /* dossier card on the night */
  --line: #3a357c;       /* card edges, dividers */
  --cream: #fff8ec;      /* slagroom: main text */
  --muted: #b9b4e6;      /* secondary text on night */
  --red: #ff5a67;        /* aardbei: alarm, stamps, wrong */
  --yellow: #ffd23f;     /* citroen: timer, hints, primary action */
  --mint: #7fe0b0;       /* pistache: solved */
  --on-yellow: #1b1840;
  --paper: #ffffff;
  --paper-ink: #1f1b45;
  --font-display: "Luckiest Guy", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --font-type: "Special Elite", "Courier New", ui-monospace, monospace;
  --radius: 18px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--night); }
body {
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  background:
    radial-gradient(1200px 600px at 50% -200px, rgba(255, 210, 63, 0.10), transparent 70%),
    var(--night);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
a { color: var(--yellow); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

/* top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  max-width: 980px; margin: 0 auto; padding-block: 12px;
  background: var(--night);
}
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-type); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.badge svg { flex: none; }
.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.tabs a {
  text-decoration: none; color: var(--muted); font-weight: 800; font-size: 15px; white-space: nowrap;
  padding: 8px 14px; border-radius: 999px; min-height: 44px; display: inline-flex; align-items: center;
}
@media (max-width: 400px) { .badge-text { display: none; } .tabs a { padding: 8px 12px; } }
.tabs a[aria-current="page"] { background: var(--yellow); color: var(--on-yellow); }

/* game column */
.game { max-width: 560px; margin: 8px auto 0; display: flex; flex-direction: column; gap: 18px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden;
}
.eyebrow { font-family: var(--font-type); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.title-xl { font-family: var(--font-display); font-weight: 400; font-size: clamp(44px, 12vw, 64px); line-height: 0.95; color: var(--yellow); letter-spacing: 0.01em; }
.title-l { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 7.5vw, 36px); line-height: 1.02; color: var(--cream); letter-spacing: 0.01em; }
.lead { font-size: 18px; color: var(--cream); }
.small { font-size: 15px; color: var(--muted); }
.stamp {
  position: absolute; right: 16px; top: 62px; transform: rotate(8deg);
  font-family: var(--font-type); font-size: 14px; letter-spacing: 0.12em; color: var(--red);
  border: 2px solid var(--red); border-radius: 6px; padding: 2px 8px; opacity: 0.9;
}
.btn {
  appearance: none; border: 0; cursor: pointer; border-radius: 14px; min-height: 54px; padding: 0 22px;
  font-family: var(--font-display); font-size: 22px; letter-spacing: 0.03em;
  background: var(--yellow); color: var(--on-yellow);
  box-shadow: 0 5px 0 #c99a12; transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c99a12; }
.btn.secondary { background: transparent; color: var(--cream); border: 2px solid var(--line); box-shadow: none; font-family: var(--font-body); font-weight: 800; font-size: 16px; }
.btn.secondary:active { transform: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* status bar */
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer {
  font-family: var(--font-display); font-size: 44px; line-height: 1; color: var(--yellow);
  font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
}
.timer.low { color: var(--red); }
.timer-label { font-family: var(--font-type); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pips { display: flex; gap: 8px; }
.pip {
  width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--line);
  display: grid; place-items: center; font-family: var(--font-display); font-size: 18px; color: var(--muted);
}
.pip.done { background: var(--mint); border-color: var(--mint); color: var(--on-yellow); }
.pip.now { border-color: var(--yellow); color: var(--yellow); }

/* code lock */
.lock { display: flex; flex-direction: column; gap: 12px; }
.lock-label { font-weight: 800; }
.boxes { position: relative; display: flex; gap: 8px; flex-wrap: nowrap; }
.boxes input {
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.01; border: 0; font-size: 16px;
  text-transform: uppercase; caret-color: transparent; cursor: text;
}
.box {
  flex: 1 1 0; min-width: 0; max-width: 58px; aspect-ratio: 4 / 5; border-radius: 12px;
  background: var(--night); border: 2px solid var(--line);
  display: grid; place-items: center; font-family: var(--font-display); font-size: clamp(22px, 7vw, 32px); color: var(--cream);
}
.boxes.focus .box.cur { border-color: var(--yellow); }
.boxes.bad .box { border-color: var(--red); }
.boxes.good .box { border-color: var(--mint); color: var(--mint); }
@media (prefers-reduced-motion: no-preference) {
  .boxes.bad { animation: shake .35s ease; }
  .pop { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
}
@keyframes shake { 0%, 100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
@keyframes pop { from { transform: scale(.85); opacity: .4 } to { transform: scale(1); opacity: 1 } }
.feedback { min-height: 24px; font-weight: 800; }
.feedback.bad { color: var(--red); }
.feedback.good { color: var(--mint); }

.hints { display: flex; flex-direction: column; gap: 10px; }
.hint-row { display: flex; gap: 8px; flex-wrap: wrap; }
.hint-btn {
  appearance: none; cursor: pointer; border-radius: 999px; min-height: 44px; padding: 0 16px;
  background: transparent; border: 2px dashed var(--yellow); color: var(--yellow); font-weight: 800; font-size: 15px;
}
.hint-btn[disabled] { opacity: .4; cursor: not-allowed; }
.hint {
  background: var(--yellow); color: var(--on-yellow); border-radius: 12px; padding: 12px 14px; font-weight: 700;
  transform: rotate(-0.6deg);
}
.found { font-family: var(--font-display); font-size: clamp(30px, 8vw, 40px); line-height: 1.05; color: var(--mint); }
.place { color: var(--yellow); }

/* finale */
.diploma {
  background: var(--paper); color: var(--paper-ink); border-radius: 10px; padding: 24px 22px; text-align: center;
  display: flex; flex-direction: column; gap: 8px; position: relative;
  box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .7);
  border: 10px solid #ffe7a3;
  outline: 2px solid #c99a12; outline-offset: -16px;
}
.diploma .d-eyebrow { font-family: var(--font-type); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #5b5690; }
.diploma .d-title { font-family: var(--font-display); font-size: clamp(26px, 7vw, 34px); line-height: 1.05; color: #d43b4a; }
.diploma .d-name { font-weight: 900; font-size: 20px; }
.diploma .d-stats { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; font-family: var(--font-type); font-size: 15px; }
.seal {
  width: 64px; height: 64px; border-radius: 50%; margin: 6px auto 0; background: #d43b4a; color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; line-height: 1; text-align: center;
  box-shadow: 0 0 0 4px #fff, 0 0 0 6px #d43b4a; transform: rotate(-8deg);
}
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(10, 9, 30, 0.82);
}
.overlay .card { max-width: 440px; text-align: center; align-items: center; }

/* parent guide */
.guide { max-width: 980px; margin: 8px auto 0; display: flex; flex-direction: column; gap: 22px; }
.guide-head { display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 15px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.form { display: grid; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 800; font-size: 15px; }
.field input, .field select {
  min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--night); padding: 0 12px; font-size: 16px; color: var(--cream);
}
.saved { font-size: 14px; color: var(--mint); min-height: 20px; }
ol.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
ol.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; }
ol.steps li::before {
  counter-increment: s; content: counter(s);
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--yellow); color: var(--yellow);
  display: grid; place-items: center; font-family: var(--font-display); font-size: 17px;
}
ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
details { border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
summary { cursor: pointer; padding: 14px 18px; font-weight: 800; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "Toon"; color: var(--yellow); font-weight: 800; }
details[open] summary::after { content: "Verberg"; }
.answers { padding: 0 18px 16px; display: grid; gap: 10px; }
.answer { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: baseline; border-top: 1px dashed var(--line); padding-top: 10px; }
.answer code { font-family: var(--font-display); font-size: 22px; color: var(--yellow); letter-spacing: .04em; }
.sheets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 760px) { .sheets { grid-template-columns: minmax(0, 1fr); } }
.sheet-wrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sheet-cap { font-family: var(--font-type); font-size: 14px; letter-spacing: .06em; color: var(--muted); }
svg.sheet { display: block; width: 100%; height: auto; aspect-ratio: 210 / 297; max-width: 100%; background: var(--paper); border-radius: 4px; box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .8); }
.note-box { border-left: 0; background: rgba(255, 210, 63, .08); border: 1px solid rgba(255, 210, 63, .35); border-radius: 14px; padding: 14px 16px; color: var(--cream); }

@media print {
  @page { size: A4; margin: 0; }
  html, body { background: #fff !important; padding: 0 !important; }
  body::before, .topbar, .game, .guide > :not(.sheets-section), .sheets-section > :not(.sheets), .sheet-cap, .overlay { display: none !important; }
  .guide, .sheets-section { display: block !important; margin: 0; max-width: none; }
  .sheets { display: block; }
  .sheet-wrap { display: block; break-after: page; }
  svg.sheet { width: 210mm; height: 297mm; box-shadow: none; border-radius: 0; }
}
</style>

</head>
<body>
<header class="topbar">
  <a class="badge" href="../" aria-label="Terug naar Feestmissie" style="text-decoration:none">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="11" cy="11" r="7.5" fill="none" stroke="#ffd23f" stroke-width="2.6"/><path d="M16.5 16.5 L23 23" stroke="#ffd23f" stroke-width="3.2" stroke-linecap="round"/><path d="M7.5 12.5 h7 l-1-3.4 h-5 z" fill="#ff5a67"/><circle cx="11" cy="8.2" r="1.3" fill="#ff5a67"/></svg>
    <span class="badge-text">Feestmissie</span>
  </a>
  <nav class="tabs" aria-label="Weergave">
    <a href="#" id="tab-play">Spelen</a>
    <a href="#ouders" id="tab-parent">Voor ouders</a>
  </nav>
</header>

<main>
  <section class="game" id="view-play" aria-live="polite"></section>
  <section class="guide" id="view-parent" hidden></section>
</main>
<div class="overlay" id="overlay" hidden></div>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ data
  var ANSWERS = ["734", "SLAGROOM", "3582", "6291"];
  var STEPS = [
    {
      title: "Wie heeft de taart gepakt?",
      text: "Open envelop 1. Op het taartbord zat een vingerafdruk. Vergelijk hem met die van de vier verdachten. Het dossiernummer van de dader is de code.",
      mode: "numeric",
      hints: [
        "Kijk naar het patroon in het midden van elke vingerafdruk: een bergje, een lusje of rondjes?",
        "De vingerafdruk van het taartbord heeft rondjes én een wit streepje erdoorheen. Wie heeft dat streepje ook?"
      ]
    },
    {
      title: "Het geheime briefje",
      text: "Open envelop 2. De dader liet een briefje achter in geheimschrift. Zoek elk teken op in de sleutel en schrijf de letter eronder. Het laatste woord is de code.",
      mode: "text",
      hints: [
        "Elk teken hoort bij één hokje in de sleutel. Een stip in het teken betekent: kijk in het rooster met de stippen.",
        "Het briefje begint met HAHA. Het laatste woord heeft 8 letters en is wit, zoet en zit op taart."
      ]
    },
    {
      title: "Hagelslag tellen",
      text: "Open envelop 3. Tel de hagelslag op de taart. Kersen tellen niet mee. Zet de aantallen in de volgorde die bovenaan het vel staat.",
      mode: "numeric",
      hints: [
        "Tel één soort tegelijk en zet een streepje op elke vorm die je al hebt geteld.",
        "Er zijn 3 sterretjes. De rest tellen jullie zelf."
      ]
    },
    {
      title: "Het verscheurde briefje",
      text: "Open envelop 4. De dader heeft een briefje verscheurd. Knip de stroken los en leg ze in de goede volgorde. Dan zie je de code van de kluis.",
      mode: "numeric",
      hints: [
        "Kijk naar de taart en de golflijn onderaan het briefje. Die moeten weer heel worden.",
        "Bovenaan staat: DE CODE VAN DE KLUIS IS. Leg de stroken zo dat je dat kunt lezen."
      ]
    }
  ];
  var DEFAULT_SETUP = { name: "Sam", minutes: 45, place2: "onder de bank", place3: "in de koelkast", place4: "in de boekenkast", cake: "in de wasmand" };
  var FRESH_GAME = { phase: "intro", step: 0, startedAt: 0, hints: [0, 0, 0, 0], finishedAt: 0, timeUpSeen: false };

  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? Object.assign({}, fallback, JSON.parse(v)) : Object.assign({}, fallback); }
    catch (e) { return Object.assign({}, fallback); }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage unavailable */ } }

  var hot = window.claude && window.claude.hot;
  var hotData = (hot && hot.data) || {};
  var setup = hotData.setup || load("taartrover-setup", DEFAULT_SETUP);
  var game = hotData.game || load("taartrover-game", FRESH_GAME);
  game.hints = (game.hints || [0, 0, 0, 0]).slice(0, 4);
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return { setup: setup, game: game }; }); } catch (e) { /* no hot reload */ } }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function persist() { save("taartrover-game", game); }
  function placeFor(stepIndex) { return [null, setup.place2, setup.place3, setup.place4][stepIndex + 1] || ""; }

  // ------------------------------------------------------------------ sound and wake lock
  var audio = null;
  function beep(good) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var notes = good ? [660, 880, 1320] : [220, 180];
      notes.forEach(function (f, i) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = good ? "triangle" : "square"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, audio.currentTime + i * 0.11);
        g.gain.exponentialRampToValueAtTime(0.18, audio.currentTime + i * 0.11 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + i * 0.11 + 0.18);
        o.connect(g).connect(audio.destination); o.start(audio.currentTime + i * 0.11); o.stop(audio.currentTime + i * 0.11 + 0.2);
      });
    } catch (e) { /* no audio */ }
  }
  var wake = null;
  function keepAwake() {
    try { if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").then(function (w) { wake = w; }).catch(function () {}); } catch (e) { /* not allowed */ }
  }
  document.addEventListener("visibilitychange", function () { if (game.phase === "play" || game.phase === "found") keepAwake(); });

  // ------------------------------------------------------------------ timer
  function elapsed() { return game.startedAt ? Math.floor(((game.finishedAt || Date.now()) - game.startedAt) / 1000) : 0; }
  function fmt(sec) { var s = Math.abs(sec); return (sec < 0 ? "+" : "") + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function tick() {
    var el = document.getElementById("timer");
    if (!el || !game.startedAt) return;
    var left = setup.minutes * 60 - elapsed();
    el.textContent = fmt(left);
    el.classList.toggle("low", left < 5 * 60);
    if (left <= 0 && !game.timeUpSeen && game.phase !== "done") {
      game.timeUpSeen = true; persist();
      showOverlay(
        '<div class="card pop"><p class="eyebrow">Tijd is om</p><h2 class="title-l">De slagroom smelt!</h2>' +
        '<p>Snel, detectives. Jullie mogen doorspelen, de klok telt nu de extra tijd.</p>' +
        '<button class="btn" type="button" id="ov-ok">Doorspelen</button></div>');
    }
  }
  setInterval(tick, 1000);

  function showOverlay(html) {
    var ov = document.getElementById("overlay");
    ov.innerHTML = html; ov.hidden = false;
    var b = ov.querySelector("button"); if (b) { b.focus(); b.addEventListener("click", function () { ov.hidden = true; }); }
  }

  // ------------------------------------------------------------------ game views
  var play = document.getElementById("view-play");

  function statusBar() {
    var pips = STEPS.map(function (s, i) {
      var cls = i < game.step || game.phase === "done" ? "pip done" : (i === game.step ? "pip now" : "pip");
      return '<span class="' + cls + '" aria-label="Envelop ' + (i + 1) + (cls === "pip done" ? ", opgelost" : "") + '">' + (i + 1) + "</span>";
    }).join("");
    return '<div class="card status"><div><div class="timer-label">Tijd over</div><div class="timer" id="timer" role="timer">' +
      fmt(setup.minutes * 60 - elapsed()) + '</div></div><div class="pips" aria-label="Enveloppen">' + pips + "</div></div>";
  }

  function renderIntro() {
    play.innerHTML =
      '<div class="card">' +
      '<span class="stamp">Streng geheim</span>' +
      '<p class="eyebrow">Dossier 7-B · Taartbureau</p>' +
      '<h1 class="title-xl">De<br>Taartrover</h1>' +
      '<p class="lead">Alarm! De verjaardagstaart van <strong>' + esc(setup.name) + '</strong> is verdwenen. Op het taartbord zit een vingerafdruk en in huis liggen geheime enveloppen.</p>' +
      '<p>Jullie zijn de beste detectives van het Taartbureau. Los vier raadsels op en open de kluis. Jullie hebben ' + esc(setup.minutes) + ' minuten, daarna smelt de slagroom.</p>' +
      '<p class="small">Jullie hebben nodig: envelop 1 (die krijgen jullie van de spelleider), een pen en een schaar.</p>' +
      '<button class="btn" type="button" id="start">Start de missie</button>' +
      "</div>";
    document.getElementById("start").addEventListener("click", function () {
      game = Object.assign({}, FRESH_GAME, { phase: "play", startedAt: Date.now(), hints: [0, 0, 0, 0] });
      persist(); beep(true); keepAwake(); render();
    });
  }

  function renderStep() {
    var i = game.step, s = STEPS[i], len = ANSWERS[i].length;
    var boxes = "";

  // fingerprints: arch, loop, whorl (and a whorl with a scar)
  var fpCount = 0;
  function fingerprint(cx, cy, w, h, type, scar) {
    var id = "fp" + (++fpCount), rx = w / 2, ry = h / 2, step = Math.min(w, h) / 17, p = [];

      }

      }

      '<g fill="none" stroke="' + INK + '" stroke-width="' + (step * 0.42).toFixed(2) + '">' + p.join("") + "</g>" + scarLine + "</g>" +

  function keyGrid(x, y, letters, dots) {

      '<path d="M' + (x + s) + " " + y + " V" + (y + 3 * s) + " M" + (x + 2 * s) + " " + y + " V" + (y + 3 * s) + " M" + x + " " + (y + s) + " H" + (x + 3 * s) + " M" + x + " " + (y + 2 * s) + " H" + (x + 3 * s) + '"/></g>';
    for (var i = 0; i < 9; i++) {
      var cx = x + (i % 3) * s + s / 2, cy = y + Math.floor(i / 3) * s + s / 2;
      o += txt(cx, cy + (dots ? 0.6 : 1.8), letters[i], 5.2, { font: F_TYPE, anchor: "middle" });
      if (dots) o += '<circle cx="' + cx + '" cy="' + (cy + 3.6) + '" r="0.9" fill="' + INK + '"/>';
    }
    return o;
  }
  function keyX(x, y, letters, dots) {
    var s = 39, o = '<g fill="none" stroke="' + INK + '" stroke-width="0.8"><path d="M' + x + " " + y + " L" + (x + s) + " " + (y + s) + " M" + (x + s) + " " + y + " L" + x + " " + (y + s) + '"/></g>';
    var pos = [[0.5, 0.2], [0.2, 0.5], [0.8, 0.5], [0.5, 0.8]];
    for (var i = 0; i < 4; i++) {
      var cx = x + pos[i][0] * s, cy = y + pos[i][1] * s;
      o += txt(cx, cy + (dots ? 0.6 : 1.8), letters[i], 5.2, { font: F_TYPE, anchor: "middle" });
      if (dots) o += '<circle cx="' + cx + '" cy="' + (cy + 3.6) + '" r="0.9" fill="' + INK + '"/>';
    }
    return o;
  }
  function sheet2() {
    var rows = [["HAHA", "DE", "CODE", "IS"], ["SLAGROOM"]], gs = 8.6, adv = 12, inner = "";
    inner += '<g transform="rotate(-1.5 105 104)"><rect x="18" y="66" width="174" height="80" rx="2" fill="#fffdf6" stroke="' + INK + '" stroke-width="0.5"/>' +
      '<path d="M18 74 H192" stroke="#f0c9cd" stroke-width="0.4"/>';
    rows.forEach(function (words, ri) {
      var total = words.reduce(function (a, w) { return a + w.length * adv; }, 0) + (words.length - 1) * 7, x = 105 - total / 2 + 1.7, y = 84 + ri * 30;
      words.forEach(function (w) {
        for (var k = 0; k < w.length; k++) {
          inner += glyph(w[k], x, y, gs) + '<path d="M' + (x - 0.5) + " " + (y + 18) + " H" + (x + gs + 0.5) + '" stroke="' + SOFT + '" stroke-width="0.4"/>';
          x += adv;
        }
        x += 7;
      });
    });
    inner += txt(186, 141, "K.K.", 5.4, { font: F_TYPE, anchor: "end" }) + "</g>";
    inner += txt(16, 162, "DE SLEUTEL", 7, { font: F_DISPLAY, fill: RED });
    inner += keyGrid(16, 170, "ABCDEFGHI", false) + keyGrid(62, 170, "JKLMNOPQR", true) + keyX(108, 170, "STUV", false) + keyX(153, 170, "WXYZ", true);
    inner += lines(16, 224, ["Voorbeeld: het teken voor E is een vierkantje, want E zit in het", "middelste hokje. Een teken met een stip zoek je op in een rooster met stippen."], 4.2, 5.8);
    inner += '<rect x="16" y="240" width="178" height="30" rx="3" fill="#fff7e0" stroke="' + INK + '" stroke-width="0.5"/>' +
      txt(22, 250, "De code is het laatste woord:", 4.6, { weight: 800 });
    for (var b = 0; b < 8; b++) inner += '<rect x="' + (22 + b * 13) + '" y="254" width="11" height="12" rx="1.5" fill="#fff" stroke="' + INK + '" stroke-width="0.5"/>';
    return frame(2, "Het geheime briefje", ["De dader liet dit briefje achter in geheimschrift. Zoek elk teken op", "in de sleutel en schrijf de letter op het streepje eronder."], inner);
  }

  // sprinkles on a cake, seeded so every print is the same
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shape(kind, x, y, r, rot) {
    var g = '<g transform="translate(' + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + rot.toFixed(1) + ')" stroke="' + INK + '" stroke-width="0.55" stroke-linejoin="round">';
    if (kind === "star") {
      var pts = [];
      for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; pts.push((Math.cos(a) * rr).toFixed(2) + "," + (Math.sin(a) * rr).toFixed(2)); }
      g += '<polygon points="' + pts.join(" ") + '" fill="#ffd23f"/>';
    } else if (kind === "dot") g += '<circle r="' + (r * 0.7) + '" fill="#ff7a85"/>';
    else if (kind === "tri") g += '<polygon points="0,' + (-r * 0.85) + " " + (r * 0.8) + "," + (r * 0.6) + " " + (-r * 0.8) + "," + (r * 0.6) + '" fill="#7aa7ff"/>';
    else g += '<rect x="' + (-r * 0.62) + '" y="' + (-r * 0.62) + '" width="' + (r * 1.24) + '" height="' + (r * 1.24) + '" fill="#7fe0b0"/>';
    return g + "</g>";
  }
  function sheet3() {
    var cx = 105, cy = 182, R = 64, inner = "";
    inner += '<rect x="16" y="64" width="178" height="30" rx="3" fill="#fff7e0" stroke="' + INK + '" stroke-width="0.5"/>' +
      txt(22, 74, "Zet de aantallen in deze volgorde:", 4.6, { weight: 800 });
    ["star", "dot", "tri", "sq"].forEach(function (k, i) {
      var x = 30 + i * 40;
      inner += shape(k, x, 84, 4.2, 0) + '<rect x="' + (x + 7) + '" y="78" width="12" height="12" rx="1.5" fill="#fff" stroke="' + INK + '" stroke-width="0.5"/>';
      if (i < 3) inner += txt(x + 27, 86.5, "→", 5, { fill: SOFT, anchor: "middle" });
    });
    inner += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R + 6) + '" fill="#f6d7a7" stroke="' + INK + '" stroke-width="0.6"/>';
    var wave = [];
    for (var a = 0; a <= 360; a += 5) { var rr = R + Math.sin(a * Math.PI / 15) * 1.6, t = a * Math.PI / 180; wave.push((cx + Math.cos(t) * rr).toFixed(2) + "," + (cy + Math.sin(t) * rr).toFixed(2)); }
    inner += '<polygon points="' + wave.join(" ") + '" fill="#fff4f7" stroke="' + INK + '" stroke-width="0.6"/>';
    var cherries = [];
    [45, 135, 225, 315].forEach(function (deg) {
      var t = deg * Math.PI / 180, x = cx + Math.cos(t) * 44, y = cy + Math.sin(t) * 44;
      cherries.push([x, y]);
      inner += '<path d="M' + x + " " + (y - 3.6) + " q2 -5 6 -6" + '" fill="none" stroke="#3d7a3a" stroke-width="0.8"/><circle cx="' + x + '" cy="' + y + '" r="4.2" fill="#c8102e" stroke="' + INK + '" stroke-width="0.6"/><circle cx="' + (x - 1.4) + '" cy="' + (y - 1.4) + '" r="1" fill="#fff" opacity=".7"/>';
    });
    var counts = { star: 3, dot: 5, tri: 8, sq: 2 }, rand = rng(20261108), placed = [];
    Object.keys(counts).forEach(function (k) {
      var n = 0, guard = 0;
      while (n < counts[k] && guard++ < 5000) {
        var ang = rand() * Math.PI * 2, rad = Math.sqrt(rand()) * (R - 9), x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad;
        var ok = placed.every(function (p) { return Math.hypot(p[0] - x, p[1] - y) > 13; }) && cherries.every(function (c) { return Math.hypot(c[0] - x, c[1] - y) > 13; });
        if (!ok) continue;
        placed.push([x, y]); inner += shape(k, x, y, 4.6, rand() * 360); n++;
      }
    });
    inner += txt(105, 264, "Let op: kersen tellen niet mee!", 5, { font: F_DISPLAY, fill: RED, anchor: "middle" });
    return frame(3, "Hagelslag tellen", ["Kapitein Kruimel heeft de hagelslag op de taart geteld. Jullie ook?", "Tel elke soort apart: sterretjes, rondjes, driehoekjes en vierkantjes."], inner);
  }

  // the torn note: one drawing, cut into six strips that are shuffled on the sheet
  function noteArt() {
    var o = '<rect x="0" y="0" width="156" height="92" fill="#fffdf6"/>';
    for (var y = 12; y < 92; y += 9) o += '<path d="M0 ' + y + ' H156" stroke="#dde3f3" stroke-width="0.4"/>';
    o += '<path d="M14 0 V92" stroke="#f0c9cd" stroke-width="0.5"/>';
    o += txt(78, 16, "DE CODE VAN", 8, { font: F_DISPLAY, anchor: "middle" });
    o += txt(78, 27, "DE KLUIS IS", 8, { font: F_DISPLAY, anchor: "middle" });
    [["6", 26], ["2", 52], ["9", 104], ["1", 130]].forEach(function (d) { o += txt(d[1], 58, d[0], 28, { font: F_DISPLAY, fill: RED, anchor: "middle" }); });
    o += '<path d="M6 72 Q19 64 32 72 T58 72 T84 72 T110 72 T136 72 T152 70" fill="none" stroke="' + INK + '" stroke-width="0.9"/>';
    o += '<g transform="translate(78 80)" stroke="' + INK + '" stroke-width="0.7"><rect x="-22" y="-6" width="44" height="12" rx="2" fill="#f6d7a7"/><rect x="-22" y="-9" width="44" height="5" rx="2" fill="#fff4f7"/>' +
      '<path d="M-14 -9 V-14 M0 -9 V-15 M14 -9 V-14" fill="none"/><path d="M-14 -16 q1 -2 0 -3 M0 -17 q1 -2 0 -3 M14 -16 q1 -2 0 -3" fill="none" stroke="#e8902a"/></g>';
    o += txt(150, 88, "K.K.", 5, { font: F_TYPE, anchor: "end" });
    return o;
  }
  function sheet4() {
    var order = [3, 0, 5, 1, 4, 2], rot = [-2.2, 1.4, -1, 2, -1.6, 1.1], sw = 26, inner = "";
    var art = noteArt();
    order.forEach(function (src, k) {
      var x = 17 + k * 30, y = 66, cxs = x + sw / 2, cys = y + 46;
      inner += '<g transform="rotate(' + rot[k] + " " + cxs + " " + cys + ')">' +
        '<svg x="' + x + '" y="' + y + '" width="' + sw + '" height="92" viewBox="' + (src * sw) + ' 0 ' + sw + ' 92">' + art + "</svg>" +
        '<rect x="' + (x - 1.4) + '" y="' + (y - 1.4) + '" width="' + (sw + 2.8) + '" height="94.8" fill="none" stroke="' + SOFT + '" stroke-width="0.4" stroke-dasharray="1.6 1.2"/></g>';
    });
    inner += '<g transform="translate(15 162)" fill="none" stroke="' + INK + '" stroke-width="0.6"><circle cx="0" cy="-2" r="1.8"/><circle cx="0" cy="2" r="1.8"/><path d="M1.5 -1 L8 2 M1.5 1 L8 -2"/></g>' +
      txt(27, 163.5, "Knip langs de stippellijnen.", 4.2, { fill: SOFT });
    inner += '<rect x="27" y="176" width="156" height="92" rx="1" fill="none" stroke="' + INK + '" stroke-width="0.5" stroke-dasharray="3 2"/>' +
      txt(105, 224, "Leg de stroken hier in de goede volgorde", 5, { fill: SOFT, anchor: "middle" });
    return frame(4, "Het verscheurde briefje", ["Kapitein Kruimel heeft zijn briefje in zes stroken gescheurd.", "Knip ze los en leg ze in de goede volgorde. Dan zie je de code van de kluis."], inner);
  }

  // ------------------------------------------------------------------ routing
  function render() {
    var parentView = location.hash === "#ouders";
    document.getElementById("view-play").hidden = parentView;
    document.getElementById("view-parent").hidden = !parentView;
    document.getElementById("tab-play").setAttribute("aria-current", parentView ? "false" : "page");
    document.getElementById("tab-parent").setAttribute("aria-current", parentView ? "page" : "false");
    if (parentView) { renderParent(); return; }
    if (game.phase === "play") renderStep();
    else if (game.phase === "found") renderFound();
    else if (game.phase === "done") renderDone();
    else renderIntro();
  }
  window.addEventListener("hashchange", render);
  function start() { render(); tick(); }
  if (hot && hot.ready) { try { hot.ready(start); } catch (e) { start(); } } else start();
})();
</script>
